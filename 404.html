<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zuper Advantage - Who We Are</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #101618;
      --card-bg: #1B2325;
      --card-border: #2E3739;
      --gold-accent: #E2BE6F;
      --text-white: #FFFFFF;
      --text-muted: #B6BEC0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .zuper-section {
      min-height: 100vh;
      max-width: 1360px;
      margin: 0 auto;
      padding: 40px 5% 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top Header & Gold Rule */
    .top-bar {
      width: 100%;
    }

    .top-label {
      text-align: right;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold-accent);
      margin-bottom: 14px;
    }

    .gold-divider {
      width: 100%;
      height: 1px;
      background-color: var(--gold-accent);
      opacity: 0.85;
    }

    /* Main Content Block */
    .main-content {
      padding: 42px 1.2% 36px;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--gold-accent);
      margin-bottom: 20px;
    }

    .main-heading {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 46px;
      font-weight: 500;
      line-height: 1.18;
      color: var(--text-white);
      margin-bottom: 22px;
      letter-spacing: -0.01em;
    }

    .subtitle {
      font-size: 16px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 820px;
      margin-bottom: 52px;
    }

    /* 2x2 Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px 28px;
    }

    .advantage-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 32px 36px 36px;
      display: flex;
      align-items: flex-start;
      gap: 32px;
      transition: border-color 0.25s ease, transform 0.25s ease;
    }

    .advantage-card:hover {
      border-color: rgba(226, 190, 111, 0.55);
      transform: translateY(-2px);
    }

    .card-number {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 20px;
      font-weight: 500;
      color: var(--gold-accent);
      line-height: 1.3;
      min-width: 26px;
    }

    .card-body h3 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-white);
      line-height: 1.3;
      margin-bottom: 14px;
    }

    .card-body p {
      font-size: 14.5px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 440px;
    }

    /* Bottom Right Brand Logo */
    .bottom-brand {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-top: 28px;
    }

    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--gold-accent);
    }

    .brand-monogram {
      width: 34px;
      height: 36px;
    }

    .brand-divider {
      width: 1px;
      height: 36px;
      background-color: var(--gold-accent);
      opacity: 0.7;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--gold-accent);
      display: flex;
      align-items: flex-start;
    }

    .brand-name sup {
      font-size: 8px;
      margin-left: 2px;
      margin-top: 2px;
    }

    .brand-sub {
      font-size: 8.5px;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Responsive Adjustments */
    @media (max-width: 960px) {
      .main-heading {
        font-size: 36px;
      }

      .cards-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .zuper-section {
        padding: 28px 6%;
      }

      .main-heading {
        font-size: 30px;
      }

      .advantage-card {
        padding: 24px 22px;
        gap: 18px;
      }
    }
  </style>
</head>
<body>

</body>
</html>
