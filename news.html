<!-- =========================================================
     KHIL CURVED IMAGE GALLERY
========================================================= -->

<style>
:root {
    --font-heading: "Familjen Grotesk", sans-serif;
}

/* MAIN SECTION */
.khil-gallery-section {
    width: 100%;
    position: relative;
    overflow: hidden;
    padding: 0;
    box-sizing: border-box;
}

/* CAROUSEL */
.khil-gallery-section .carousel {
    position: relative;
    width: 100%;
    overflow: hidden;
    cursor: grab;
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
}

.khil-gallery-section .carousel.dragging {
    cursor: grabbing;
}

/* SLIDES */
.khil-gallery-section .slide {
    position: absolute;
    top: 0;
    left: 0;
    background-color: #e9ecef;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    will-change: transform, clip-path;
    pointer-events: none;
}

/* NAVIGATION */
.khil-gallery-navigation {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-top: 25px;
}

.khil-gallery-navigation button {
    width: 46px;
    height: 46px;
    border: 1px solid #222;
    border-radius: 50%;
    background: transparent;
    color: #222;
    font-size: 21px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all .3s ease;
}

.khil-gallery-navigation button:hover {
    background: #222;
    color: #fff;
}

/* RESPONSIVE */
@media(max-width:1024px) {
    .khil-gallery-navigation {
        margin-top: 20px;
    }
}

@media(max-width:767px) {
    .khil-gallery-section .carousel {
        min-height: 220px;
    }

    .khil-gallery-navigation {
        margin-top: 15px;
        gap: 12px;
    }

    .khil-gallery-navigation button {
        width: 38px;
        height: 38px;
        font-size: 18px;
    }
}

@media(prefers-reduced-motion:reduce) {
    .khil-gallery-navigation button {
        transition: none;
    }
}
</style>


<!-- =========================================================
     HTML
========================================================= -->

<section class="khil-gallery-section">

    <div class="carousel" id="carousel"></div>

    <div class="khil-gallery-navigation">

        <button type="button"
                id="galleryPrevBtn"
                aria-label="Previous image">
            &#8592;
        </button>

        <button type="button"
                id="galleryNextBtn"
                aria-label="Next image">
            &#8594;
        </button>

    </div>

</section>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>
document.addEventListener("DOMContentLoaded", function () {

    /* ==========================================
       1. GALLERY IMAGES
    ========================================== */

    // Replace these paths with your actual gallery images.

    const IMAGES = [
        "assets/img/gallery/collage-photos/photo_01.jpg",
        "assets/img/gallery/collage-photos/photo_02.jpg",
        "assets/img/gallery/collage-photos/photo_03.jpg",
        "assets/img/gallery/collage-photos/photo_04.jpg",
        "assets/img/gallery/collage-photos/photo_05.jpg",
        "assets/img/gallery/collage-photos/photo_06.jpg",
        "assets/img/gallery/collage-photos/photo_07.jpg",
        "assets/img/gallery/collage-photos/photo_08.jpg",
        "assets/img/gallery/collage-photos/photo_09.jpg",
        "assets/img/gallery/collage-photos/photo_10.jpg",
        "assets/img/gallery/collage-photos/photo_11.jpg",
        "assets/img/gallery/collage-photos/photo_12.jpg",
        "assets/img/gallery/collage-photos/photo_13.jpg",
        "assets/img/gallery/collage-photos/photo_14.jpg",
        "assets/img/gallery/collage-photos/photo_15.jpg",
        "assets/img/gallery/collage-photos/photo_16.jpg",
        "assets/img/gallery/collage-photos/photo_17.jpg",
        "assets/img/gallery/collage-photos/photo_18.jpg"
    ];

    // For Laravel Blade, you can use:
    // const IMAGES = @json($galleryImages);


    /* ==========================================
       2. SETTINGS
    ========================================== */

    const SLIDE_SPEED = 0.45;
    const PAUSE_ON_HOVER = true;
    const MAX_WIDTH = 0;

    const CARD_WIDTHS = [81, 86, 130, 156];
    const GAP = 4;
    const DESIGN_EDGE = 411;
    const MIN_HEIGHT = 58;
    const CORNER = 8;
    const DRAG_UNIT = 105;


    /* ==========================================
       3. INITIAL VARIABLES
    ========================================== */

    const carousel = document.getElementById("carousel");

    if (!carousel || !IMAGES.length) return;

    let slides = [];
    let count = 0;
    let scale = 1;
    let shift = 0;

    let dragging = false;
    let lastX = 0;
    let hovering = false;

    const reduceMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
    ).matches;


    /* ==========================================
       4. HELPER FUNCTIONS
    ========================================== */

    function between(list, position) {

        const last = list.length - 1;

        if (position >= last) {
            return list[last];
        }

        const i = Math.floor(position);

        return list[i] +
            (list[i + 1] - list[i]) *
            (position - i);
    }


    function curveHeight(x) {

        x = Math.abs(x);

        if (x <= DESIGN_EDGE) {

            return MIN_HEIGHT +
                83 * Math.pow(x / DESIGN_EDGE, 2);
        }

        return MIN_HEIGHT + 83 +
            (166 / DESIGN_EDGE) *
            (x - DESIGN_EDGE);
    }


    /* ==========================================
       5. CARD POSITIONS
    ========================================== */

    const centres = [0];
    const steps = [];

    for (let i = 0; i < 60; i++) {

        steps[i] =
            (between(CARD_WIDTHS, i) +
            between(CARD_WIDTHS, i + 1)) / 2 + GAP;

        centres[i + 1] =
            centres[i] + steps[i];
    }

    const FIT = DESIGN_EDGE /
        (
            centres[3] +
            0.5 * steps[3] +
            between(CARD_WIDTHS, 3.5) / 2
        );


    function centreOf(position) {

        const i = Math.floor(position);

        return (
            centres[i] +
            (position - i) * steps[i]
        ) * FIT;
    }


    /* ==========================================
       6. ROUNDED SHAPE
    ========================================== */

    function roundedShape(points, radius) {

        let path = "";
        const n = points.length;

        for (let i = 0; i < n; i++) {

            const p = points[i];

            const before =
                points[(i + n - 1) % n];

            const after =
                points[(i + 1) % n];

            const d1 = Math.hypot(
                before[0] - p[0],
                before[1] - p[1]
            );

            const d2 = Math.hypot(
                after[0] - p[0],
                after[1] - p[1]
            );

            const r = Math.min(
                radius,
                d1 / 2.2,
                d2 / 2.2
            );

            const start = [
                p[0] +
                (before[0] - p[0]) / d1 * r,

                p[1] +
                (before[1] - p[1]) / d1 * r
            ];

            const end = [
                p[0] +
                (after[0] - p[0]) / d2 * r,

                p[1] +
                (after[1] - p[1]) / d2 * r
            ];

            path +=
                (i ? "L" : "M") +
                start[0].toFixed(1) + " " +
                start[1].toFixed(1) +
                "Q" +
                p[0].toFixed(1) + " " +
                p[1].toFixed(1) + " " +
                end[0].toFixed(1) + " " +
                end[1].toFixed(1);
        }

        return path + "Z";
    }


    /* ==========================================
       7. CREATE SLIDES
    ========================================== */

    function buildSlides(total) {

        carousel.innerHTML = "";

        count = total;
        slides = [];

        for (let i = 0; i < total; i++) {

            const el = document.createElement("div");

            el.className = "slide";

            el.style.backgroundImage =
                'url("' +
                IMAGES[i % IMAGES.length] +
                '")';

            carousel.appendChild(el);

            slides.push(el);
        }
    }


    /* ==========================================
       8. RESPONSIVE RESIZE
    ========================================== */

    function resize() {

        if (!carousel.clientWidth) return;

        if (MAX_WIDTH > 0) {

            carousel.style.maxWidth =
                MAX_WIDTH + "px";
        }

        scale =
            carousel.clientWidth /
            (DESIGN_EDGE * 2);

        const total =
            Math.ceil(16 / IMAGES.length) *
            IMAGES.length;

        if (total !== count) {

            buildSlides(total);
        }

        carousel.style.height =
            Math.max(
                220,
                2 * curveHeight(DESIGN_EDGE) + 4
            ) * scale + "px";

        draw();

        if (
            window.AOS &&
            typeof window.AOS.refresh === "function"
        ) {
            window.AOS.refresh();
        }
    }


    /* ==========================================
       9. DRAW CAROUSEL
    ========================================== */

    function draw() {

        const middleX =
            carousel.clientWidth / 2;

        const middleY =
            carousel.clientHeight / 2;

        slides.forEach(function (el, i) {

            const position =
                (
                    (
                        i - 3.5 +
                        shift +
                        count / 2
                    ) % count + count
                ) % count - count / 2;

            const distance =
                Math.abs(position);

            const centre =
                (position < 0 ? -1 : 1) *
                centreOf(distance);

            const half =
                between(CARD_WIDTHS, distance) *
                FIT / 2;

            const left = centre - half;
            const right = centre + half;

            const leftH = curveHeight(left);
            const rightH = curveHeight(right);

            const width = half * 2;

            const height =
                2 * Math.max(leftH, rightH);

            el.style.width =
                width * scale + "px";

            el.style.height =
                height * scale + "px";

            el.style.transform =
                "translate(" +
                (middleX + left * scale) +
                "px," +
                (middleY - height * scale / 2) +
                "px)";

            const corners = [

                [0, height / 2 - leftH],

                [width, height / 2 - rightH],

                [width, height / 2 + rightH],

                [0, height / 2 + leftH]

            ].map(function (p) {

                return [
                    p[0] * scale,
                    p[1] * scale
                ];
            });

            el.style.clipPath =
                "path('" +
                roundedShape(
                    corners,
                    CORNER * scale
                ) +
                "')";
        });
    }


    /* ==========================================
       10. AUTOMATIC SLIDING
    ========================================== */

    let lastTime = performance.now();

    function animate(now) {

        const seconds = Math.min(
            0.05,
            (now - lastTime) / 1000
        );

        lastTime = now;

        if (
            !dragging &&
            !hovering &&
            !reduceMotion
        ) {
            shift -= SLIDE_SPEED * seconds;
        }

        draw();

        requestAnimationFrame(animate);
    }


    /* ==========================================
       11. MOUSE AND TOUCH DRAG
    ========================================== */

    carousel.addEventListener(
        "pointerdown",
        function (e) {

            if (e.pointerType === "mouse" &&
                e.button !== 0) return;

            dragging = true;
            lastX = e.clientX;

            carousel.classList.add("dragging");

            carousel.setPointerCapture(e.pointerId);
        }
    );


    carousel.addEventListener(
        "pointermove",
        function (e) {

            if (!dragging) return;

            shift +=
                (e.clientX - lastX) /
                (DRAG_UNIT * scale);

            lastX = e.clientX;

            draw();
        }
    );


    function stopDragging() {

        dragging = false;

        carousel.classList.remove("dragging");
    }


    carousel.addEventListener(
        "pointerup",
        stopDragging
    );

    carousel.addEventListener(
        "pointercancel",
        stopDragging
    );

    carousel.addEventListener(
        "lostpointercapture",
        stopDragging
    );


    /* ==========================================
       12. PAUSE ON HOVER
    ========================================== */

    if (PAUSE_ON_HOVER) {

        carousel.addEventListener(
            "mouseenter",
            function () {
                hovering = true;
            }
        );

        carousel.addEventListener(
            "mouseleave",
            function () {
                hovering = false;
            }
        );
    }


    /* ==========================================
       13. PREVIOUS BUTTON
    ========================================== */

    const galleryPrev =
        document.getElementById(
            "galleryPrevBtn"
        );

    if (galleryPrev) {

        galleryPrev.addEventListener(
            "click",
            function () {

                shift += 1;

                draw();
            }
        );
    }


    /* ==========================================
       14. NEXT BUTTON
    ========================================== */

    const galleryNext =
        document.getElementById(
            "galleryNextBtn"
        );

    if (galleryNext) {

        galleryNext.addEventListener(
            "click",
            function () {

                shift -= 1;

                draw();
            }
        );
    }


    /* ==========================================
       15. INITIALIZE
    ========================================== */

    if ("ResizeObserver" in window) {

        const observer =
            new ResizeObserver(resize);

        observer.observe(carousel);

    } else {

        window.addEventListener(
            "resize",
            resize
        );
    }

    resize();

    requestAnimationFrame(animate);

});
</script>
